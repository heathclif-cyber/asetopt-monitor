# AsetOpt Monitor — self-host (Docker Desktop di Windows disarankan)
# Panduan lengkap: DEPLOY_SELFHOST.md
#
# PowerShell (root repo):
#   copy .env.selfhost.example .env.selfhost
#   # edit .env.selfhost
#   .\scripts\selfhost.ps1 up

name: asetopt-monitor

services:
  db:
    # PostgreSQL 18 with PostGIS 3.6. Required by the GIS feature migrations.
    # Both PostgreSQL 18 images use /var/lib/postgresql for the data volume.
    image: postgis/postgis:18-3.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-asetopt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asetopt_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-asetopt}
    volumes:
      - asetopt_pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    env_file:
      - .env.selfhost
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-asetopt}:${POSTGRES_PASSWORD:-asetopt_change_me}@db:5432/${POSTGRES_DB:-asetopt}
      PORT: "8000"
      UPLOAD_DIR: /app/uploads
      SUPERMAN_STATE_PATH: /app/data/.superman_state.json
      SUPERMAN_HEADLESS: "true"
      MIGRATIONS_DIR: /supabase/migrations
      GIS_UPLOAD_ROOT: /app/gis-data
    volumes:
      - asetopt_uploads:/app/uploads
      - asetopt_superman:/app/data
      - asetopt_gis_data:/app/gis-data
    ports:
      # Port 8000 is occupied by another application on this host. The web
      # service continues to reach API internally at http://api:8000.
      - "127.0.0.1:${API_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 45s

  # Processes queued GIS import jobs (KML/KMZ/GeoJSON/Shapefile/GPKG).
  # Without this service, uploads are saved and queued but never parsed —
  # they stay stuck in "uploaded"/"processing" with no error shown, and
  # nothing appears on the map or in the GIS table.
  gis-worker:
    build:
      context: .
      dockerfile: docker/gis.Dockerfile
    restart: unless-stopped
    env_file:
      - .env.selfhost
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-asetopt}:${POSTGRES_PASSWORD:-asetopt_change_me}@db:5432/${POSTGRES_DB:-asetopt}
      GIS_UPLOAD_ROOT: /app/gis-data
    command: ["python", "-m", "services.gis.worker"]
    volumes:
      - asetopt_gis_data:/app/gis-data
    depends_on:
      db:
        condition: service_healthy

  # One-shot schema migration
  #   docker compose --env-file .env.selfhost --profile tools run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file:
      - .env.selfhost
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-asetopt}:${POSTGRES_PASSWORD:-asetopt_change_me}@db:5432/${POSTGRES_DB:-asetopt}
      MIGRATIONS_DIR: /supabase/migrations
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - tools
    entrypoint: ["python", "_migrate.py"]

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3001"
      API_PROXY_URL: http://api:8000
    ports:
      - "${WEB_PORT:-3001}:3001"
    depends_on:
      api:
        condition: service_healthy

volumes:
  asetopt_pgdata:
  asetopt_uploads:
  asetopt_superman:
  asetopt_gis_data:
